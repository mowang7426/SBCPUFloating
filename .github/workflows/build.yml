name: Build SBCPUFloating V1.5.3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:

      # ==============================
      # 获取源码
      # ==============================

      - name: Checkout
        uses: actions/checkout@v4


      # ==============================
      # 安装基础工具
      # ==============================

      - name: Install dependencies
        run: |
          brew install make dpkg ldid


      # ==============================
      # 安装 Theos
      # ==============================

      - name: Install RootHide Theos
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/roothide/theos/master/bin/install-theos)"



      # ==============================
      # 安装 iPhoneOS 16.5 SDK
      # ==============================

      - name: Install iPhoneOS 16.5 SDK
        run: |

          mkdir -p "$THEOS/sdks"

          curl -L \
            "https://github.com/theos/sdks/releases/download/16.5-1/iPhoneOS16.5.sdk.tar.xz" \
            -o /tmp/iPhoneOS16.5.sdk.tar.xz

          tar -xf \
            /tmp/iPhoneOS16.5.sdk.tar.xz \
            -C "$THEOS/sdks"



      # ==============================
      # 创建输出目录
      # ==============================

      - name: Prepare build directory
        run: |
          rm -rf build
          mkdir -p build



      # ==============================
      # 编译 Rootless
      # ==============================

      - name: Build Rootless
        run: |

          make clean

          THEOS_PACKAGE_SCHEME=rootless \
            make package FINALPACKAGE=1



      # ==============================
      # 保存 Rootless
      # ==============================

      - name: Copy Rootless package
        run: |

          ROOTLESS_DEB=$(find packages -maxdepth 1 -type f -name "*.deb" | head -n 1)

          if [ -z "$ROOTLESS_DEB" ]; then
            echo "Rootless .deb not found"
            exit 1
          fi

          cp "$ROOTLESS_DEB" \
            "build/SBCPUFloating-V1.5.3-rootless.deb"



      # ==============================
      # 清理后编译 RootHide
      # ==============================

      - name: Build RootHide
        run: |

          make clean

          THEOS_PACKAGE_SCHEME=roothide \
            make package FINALPACKAGE=1



      # ==============================
      # 保存 RootHide
      # ==============================

      - name: Copy RootHide package
        run: |

          ROOTHIDE_DEB=$(find packages -maxdepth 1 -type f -name "*.deb" | head -n 1)

          if [ -z "$ROOTHIDE_DEB" ]; then
            echo "RootHide .deb not found"
            exit 1
          fi

          cp "$ROOTHIDE_DEB" \
            "build/SBCPUFloating-V1.5.3-roothide.deb"



      # ==============================
      # 检查最终文件
      # ==============================

      - name: Show build results
        run: |

          echo "=============================="
          echo "SBCPUFloating V1.5.3"
          echo "=============================="

          ls -lh build/

          echo ""
          echo "Build completed successfully."



      # ==============================
      # 上传两个 DEB
      # ==============================

      - name: Upload DEB packages
        uses: actions/upload-artifact@v4

        with:

          name: SBCPUFloating-V1.5.3

          path: build/*.deb
