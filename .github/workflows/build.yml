name: Build SBCPUFloating V1.5.5

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:

      # ==============================
      # 获取源码
      # ==============================

      - name: Checkout
        uses: actions/checkout@v4


      # ==============================
      # 安装基础工具
      # ==============================

      - name: Install dependencies
        run: |
          brew install make dpkg ldid xz


      # ==============================
      # 设置 THEOS
      # ==============================

      - name: Set THEOS
        run: |
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH


      # ==============================
      # 安装 RootHide Theos
      # ==============================

      - name: Install RootHide Theos
        run: |

          rm -rf "$HOME/theos"

          git clone --recursive \
            https://github.com/roothide/theos.git \
            "$HOME/theos"

          echo "RootHide Theos installed."

          ls -la "$HOME/theos"


      # ==============================
      # 安装 iPhoneOS 16.5 SDK
      #
      # 不再使用 GitHub Release API
      # 不再使用固定 release 下载地址
      #
      # 直接从 theos/sdks 仓库
      # sparse checkout 16.5 SDK
      # ==============================

      - name: Install iPhoneOS 16.5 SDK
        run: |

          set -e

          echo "========================================"
          echo " Download iPhoneOS 16.5 SDK"
          echo "========================================"

          rm -rf /tmp/theos-sdks

          mkdir -p "$HOME/theos/sdks"

          git clone \
            --depth=1 \
            --filter=blob:none \
            --sparse \
            https://github.com/theos/sdks.git \
            /tmp/theos-sdks

          cd /tmp/theos-sdks

          git sparse-checkout set iPhoneOS16.5.sdk

          echo ""
          echo "SDK repository downloaded."

          ls -la

          if [ ! -d "iPhoneOS16.5.sdk" ]; then
            echo ""
            echo "ERROR: iPhoneOS16.5.sdk not found!"
            exit 1
          fi

          echo ""
          echo "Copying SDK to Theos..."

          rm -rf "$HOME/theos/sdks/iPhoneOS16.5.sdk"

          cp -R \
            "iPhoneOS16.5.sdk" \
            "$HOME/theos/sdks/"

          echo ""
          echo "Installed SDKs:"
          ls -lh "$HOME/theos/sdks"

          echo ""
          echo "SDK directory:"
          ls -lh "$HOME/theos/sdks/iPhoneOS16.5.sdk"


      # ==============================
      # 检查 Theos
      # ==============================

      - name: Verify Theos
        run: |

          echo "========================================"
          echo " THEOS"
          echo "========================================"

          echo "$THEOS"

          echo ""
          echo "========================================"
          echo " SDK"
          echo "========================================"

          ls -lh "$THEOS/sdks"

          echo ""
          echo "Checking iPhoneOS16.5.sdk..."

          if [ ! -d "$THEOS/sdks/iPhoneOS16.5.sdk" ]; then
            echo "ERROR: iPhoneOS16.5.sdk is missing!"
            exit 1
          fi

          echo ""
          echo "iPhoneOS16.5.sdk OK."

          echo ""
          echo "========================================"
          echo " Clang"
          echo "========================================"

          "$THEOS/toolchain/linux/iphone/bin/clang" \
            --version || true


      # ==============================
      # 创建输出目录
      # ==============================

      - name: Prepare build directory
        run: |

          rm -rf build

          mkdir -p build


      # ==============================
      # 编译 Rootless
      # ==============================

      - name: Build Rootless
        run: |

          set -e

          make clean

          THEOS_PACKAGE_SCHEME=rootless \
            make package FINALPACKAGE=1


      # ==============================
      # 保存 Rootless
      # ==============================

      - name: Copy Rootless package
        run: |

          set -e

          ROOTLESS_DEB=$(find packages \
            -maxdepth 1 \
            -type f \
            -name "*.deb" \
            | head -n 1)

          if [ -z "$ROOTLESS_DEB" ]; then
            echo "ERROR: Rootless .deb not found!"
            exit 1
          fi

          echo "Rootless package:"
          echo "$ROOTLESS_DEB"

          cp "$ROOTLESS_DEB" \
            "build/SBCPUFloating-V1.5.5-rootless.deb"


      # ==============================
      # 清理 Rootless
      # ==============================

      - name: Clean before RootHide
        run: |

          make clean

          rm -rf packages


      # ==============================
      # 编译 RootHide
      # ==============================

      - name: Build RootHide
        run: |

          set -e

          THEOS_PACKAGE_SCHEME=roothide \
            make package FINALPACKAGE=1


      # ==============================
      # 保存 RootHide
      # ==============================

      - name: Copy RootHide package
        run: |

          set -e

          ROOTHIDE_DEB=$(find packages \
            -maxdepth 1 \
            -type f \
            -name "*.deb" \
            | head -n 1)

          if [ -z "$ROOTHIDE_DEB" ]; then
            echo "ERROR: RootHide .deb not found!"
            exit 1
          fi

          echo "RootHide package:"
          echo "$ROOTHIDE_DEB"

          cp "$ROOTHIDE_DEB" \
            "build/SBCPUFloating-V1.5.5-roothide.deb"


      # ==============================
      # 最终检查
      # ==============================

      - name: Show build results
        run: |

          echo ""
          echo "========================================"
          echo " SBCPUFloating V1.5.5"
          echo "========================================"

          echo ""
          echo "Build directory:"

          ls -lh build/

          echo ""
          echo "Checking packages..."

          test -f "build/SBCPUFloating-V1.5.5-rootless.deb"
          test -f "build/SBCPUFloating-V1.5.5-roothide.deb"

          echo ""
          echo "========================================"
          echo " Both DEB packages found!"
          echo "========================================"

          echo ""
          echo "Rootless:"
          ls -lh "build/SBCPUFloating-V1.5.5-rootless.deb"

          echo ""
          echo "RootHide:"
          ls -lh "build/SBCPUFloating-V1.5.5-roothide.deb"

          echo ""
          echo "========================================"
          echo " Build completed successfully!"
          echo "========================================"


      # ==============================
      # 上传两个 DEB
      # ==============================

      - name: Upload DEB packages
        uses: actions/upload-artifact@v4

        with:

          name: SBCPUFloating-V1.5.5

          path: build/*.deb
