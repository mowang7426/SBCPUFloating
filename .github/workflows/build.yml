name: Build SBCPUFloating


on:
  workflow_dispatch:
  push:
    branches:
      - main


jobs:

 build:

  runs-on: macos-14


  steps:


  - name: Checkout
    uses: actions/checkout@v4


  - name: Install Theos
    run: |

        git clone --recursive https://github.com/roothide/theos.git $HOME/theos

        echo "THEOS installed"

        ls $HOME/theos


  - name: Install SDK
    run: |

        mkdir -p $HOME/theos/sdks

        cd $HOME/theos/sdks


        git clone --depth=1 https://github.com/xybp888/iOS-SDKs.git sdkrepo


        cp -R sdkrepo/iPhoneOS16.5.sdk .


        rm -rf sdkrepo


        ls -la



  - name: Build

    run: |

      export THEOS=$HOME/theos

      make package FINALPACKAGE=1



  - name: Upload

    uses: actions/upload-artifact@v4

    with:

      name: SBCPUFloating

      path: packages/*.deb
