name: Build SBCPUFloating V1.5.5

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:

      # ==============================
      # 获取源码
      # ==============================

      - name: Checkout
        uses: actions/checkout@v4


      # ==============================
      # 安装基础工具
      # ==============================

      - name: Install dependencies
        run: |
          brew install make dpkg ldid xz


      # ==============================
      # 设置 THEOS
      # ==============================

      - name: Set THEOS
        run: |
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH


      # ==============================
      # 克隆 RootHide Theos
      # 不使用 install-theos
      # 避免 GitHub API SDK 下载失败
      # ==============================

      - name: Install RootHide Theos
        run: |
          rm -rf "$HOME/theos"

          git clone --recursive \
            https://github.com/roothide/theos.git \
            "$HOME/theos"

          echo "RootHide Theos installed."

          ls -la "$HOME/theos"


      # ==============================
      # 安装 iPhoneOS 16.5 SDK
      # 手动安装，绕过 GitHub API
      # ==============================

      - name: Install iPhoneOS 16.5 SDK
        run: |

          mkdir -p "$HOME/theos/sdks"

          curl -L \
            --retry 5 \
            --retry-delay 3 \
            --fail \
            "https://github.com/theos/sdks/releases/download/16.5-1/iPhoneOS16.5.sdk.tar.xz" \
            -o /tmp/iPhoneOS16.5.sdk.tar.xz

          tar -xf \
            /tmp/iPhoneOS16.5.sdk.tar.xz \
            -C "$HOME/theos/sdks"

          echo "Installed SDKs:"
          ls -lh "$HOME/theos/sdks"


      # ==============================
      # 检查 Theos
      # ==============================

      - name: Verify Theos
        run: |

          echo "=============================="
          echo "THEOS"
          echo "=============================="

          echo "$THEOS"

          echo ""
          echo "=============================="
          echo "SDK"
          echo "=============================="

          ls -lh "$THEOS/sdks"

          echo ""
          echo "=============================="
          echo "Clang"
          echo "=============================="

          "$THEOS/toolchain/linux/iphone/bin/clang" \
            --version || true


      # ==============================
      # 创建输出目录
      # ==============================

      - name: Prepare build directory
        run: |

          rm -rf build

          mkdir -p build


      # ==============================
      # 编译 Rootless
      # ==============================

      - name: Build Rootless
        run: |

          make clean

          THEOS_PACKAGE_SCHEME=rootless \
            make package FINALPACKAGE=1


      # ==============================
      # 保存 Rootless
      # ==============================

      - name: Copy Rootless package
        run: |

          ROOTLESS_DEB=$(find packages \
            -maxdepth 1 \
            -type f \
            -name "*.deb" \
            | head -n 1)

          if [ -z "$ROOTLESS_DEB" ]; then
            echo "Rootless .deb not found"
            exit 1
          fi

          echo "Rootless package:"
          echo "$ROOTLESS_DEB"

          cp "$ROOTLESS_DEB" \
            "build/SBCPUFloating-V1.5.5-rootless.deb"


      # ==============================
      # 清理 Rootless
      # ==============================

      - name: Clean before RootHide
        run: |

          make clean

          rm -rf packages


      # ==============================
      # 编译 RootHide
      # ==============================

      - name: Build RootHide
        run: |

          THEOS_PACKAGE_SCHEME=roothide \
            make package FINALPACKAGE=1


      # ==============================
      # 保存 RootHide
      # ==============================

      - name: Copy RootHide package
        run: |

          ROOTHIDE_DEB=$(find packages \
            -maxdepth 1 \
            -type f \
            -name "*.deb" \
            | head -n 1)

          if [ -z "$ROOTHIDE_DEB" ]; then
            echo "RootHide .deb not found"
            exit 1
          fi

          echo "RootHide package:"
          echo "$ROOTHIDE_DEB"

          cp "$ROOTHIDE_DEB" \
            "build/SBCPUFloating-V1.5.5-roothide.deb"


      # ==============================
      # 最终检查
      # ==============================

      - name: Show build results
        run: |

          echo ""
          echo "========================================"
          echo " SBCPUFloating V1.5.5"
          echo "========================================"

          echo ""
          echo "Build directory:"

          ls -lh build/

          echo ""
          echo "========================================"
          echo " Build completed successfully!"
          echo "========================================"


      # ==============================
      # 上传两个 DEB
      # ==============================

      - name: Upload DEB packages
        uses: actions/upload-artifact@v4

        with:

          name: SBCPUFloating-V1.5.5

          path: build/*.deb
