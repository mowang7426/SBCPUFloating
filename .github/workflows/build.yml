name: Build SBCPUFloating V1.5.3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:

      # ==============================
      # 获取源码
      # ==============================

      - name: Checkout
        uses: actions/checkout@v4


      # ==============================
      # 安装基础工具
      # ==============================

      - name: Install dependencies
        run: |
          brew install make dpkg ldid


      # ==============================
      # 安装 RootHide Theos
      # ==============================

      - name: Install RootHide Theos
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/roothide/theos/master/bin/install-theos)"


      # ==============================
      # 安装 iPhoneOS 16.5 SDK
      # ==============================

      - name: Install iPhoneOS 16.5 SDK
        run: |

          mkdir -p "$THEOS/sdks"

          curl -L \
            "https://github.com/theos/sdks/releases/download/16.5-1/iPhoneOS16.5.sdk.tar.xz" \
            -o /tmp/iPhoneOS16.5.sdk.tar.xz

          tar -xf \
            /tmp/iPhoneOS16.5.sdk.tar.xz \
            -C "$THEOS/sdks"


      # ==============================
      # 准备目录
      # ==============================

      - name: Prepare build directories
        run: |

          set -e

          rm -rf build
          rm -rf packages

          mkdir -p build/rootless
          mkdir -p build/roothide

          echo "Build directories prepared."


      # ============================================================
      # ROOTLESS
      # ============================================================

      - name: Build Rootless
        run: |

          set -e

          echo "=============================="
          echo "Building ROOTLESS"
          echo "=============================="

          rm -rf packages
          mkdir -p packages

          make clean

          THEOS_PACKAGE_SCHEME=rootless \
            make package FINALPACKAGE=1

          echo ""
          echo "Rootless packages:"

          find packages \
            -maxdepth 1 \
            -type f \
            -name "*.deb" \
            -print


      # ==============================
      # 保存 Rootless
      # ==============================

      - name: Copy Rootless package
        run: |

          set -e

          ROOTLESS_DEB=$(find packages \
            -maxdepth 1 \
            -type f \
            -name "*.deb" \
            | head -n 1)

          if [ -z "$ROOTLESS_DEB" ]; then
            echo "ERROR: Rootless .deb not found"
            exit 1
          fi

          echo "Rootless package:"
          echo "$ROOTLESS_DEB"

          cp "$ROOTLESS_DEB" \
            "build/rootless/SBCPUFloating-V1.5.3-rootless.deb"

          ls -lh build/rootless/


      # ==============================
      # 上传 Rootless
      # ==============================

      - name: Upload Rootless DEB
        uses: actions/upload-artifact@v4

        with:
          name: SBCPUFloating-V1.5.3-rootless
          path: build/rootless/SBCPUFloating-V1.5.3-rootless.deb
          if-no-files-found: error


      # ============================================================
      # ROOT HIDE
      # ============================================================

      - name: Build RootHide
        run: |

          set -e

          echo "=============================="
          echo "Building ROOTHIDE"
          echo "=============================="

          rm -rf packages
          mkdir -p packages

          make clean

          THEOS_PACKAGE_SCHEME=roothide \
            make package FINALPACKAGE=1

          echo ""
          echo "RootHide packages:"

          find packages \
            -maxdepth 1 \
            -type f \
            -name "*.deb" \
            -print


      # ==============================
      # 保存 RootHide
      # ==============================

      - name: Copy RootHide package
        run: |

          set -e

          ROOTHIDE_DEB=$(find packages \
            -maxdepth 1 \
            -type f \
            -name "*.deb" \
            | head -n 1)

          if [ -z "$ROOTHIDE_DEB" ]; then
            echo "ERROR: RootHide .deb not found"
            exit 1
          fi

          echo "RootHide package:"
          echo "$ROOTHIDE_DEB"

          cp "$ROOTHIDE_DEB" \
            "build/roothide/SBCPUFloating-V1.5.3-roothide.deb"

          ls -lh build/roothide/


      # ==============================
      # 上传 RootHide
      # ==============================

      - name: Upload RootHide DEB
        uses: actions/upload-artifact@v4

        with:
          name: SBCPUFloating-V1.5.3-roothide
          path: build/roothide/SBCPUFloating-V1.5.3-roothide.deb
          if-no-files-found: error


      # ==============================
      # 最终检查
      # ==============================

      - name: Final package check
        run: |

          set -e

          echo ""
          echo "========================================"
          echo "SBCPUFloating V1.5.3 BUILD RESULTS"
          echo "========================================"

          echo ""
          echo "[ROOTLESS]"
          ls -lh build/rootless/

          echo ""
          echo "[ROOTHIDE]"
          ls -lh build/roothide/

          echo ""
          echo "[ALL DEB FILES]"
          find build \
            -type f \
            -name "*.deb" \
            -print

          ROOTLESS_COUNT=$(find build/rootless \
            -type f \
            -name "*.deb" \
            | wc -l)

          ROOTHIDE_COUNT=$(find build/roothide \
            -type f \
            -name "*.deb" \
            | wc -l)

          if [ "$ROOTLESS_COUNT" -ne 1 ]; then
            echo "ERROR: Rootless package count is $ROOTLESS_COUNT"
            exit 1
          fi

          if [ "$ROOTHIDE_COUNT" -ne 1 ]; then
            echo "ERROR: RootHide package count is $ROOTHIDE_COUNT"
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "SUCCESS"
          echo "========================================"

          echo ""
          echo "Rootless:"
          echo "build/rootless/SBCPUFloating-V1.5.3-rootless.deb"

          echo ""
          echo "RootHide:"
          echo "build/roothide/SBCPUFloating-V1.5.3-roothide.deb"
